name: Auto Merge PRs

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - '**'  # Run for all branches

env:
  # Lista de usuarios autorizados para auto-merge (separados por coma)
  AUTHORIZED_AUTHORS: "cryptoganster"

jobs:
  auto-merge:
    name: Auto Merge & Rebase
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get PR Info
        id: pr-info
        uses: actions/github-script@v8
        with:
          script: |
            // Get PRs associated with the workflow run
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });
            
            if (pullRequests.length === 0) {
              console.log('No open PRs found for this branch');
              core.setOutput('should_merge', 'false');
              return;
            }
            
            const pr = pullRequests[0];
            
            // Skip if PR is draft
            if (pr.draft) {
              console.log('PR is draft, skipping auto-merge');
              core.setOutput('should_merge', 'false');
              return;
            }
            
            const authorizedAuthors = process.env.AUTHORIZED_AUTHORS.split(',').map(a => a.trim().toLowerCase());
            const prAuthor = pr.user.login.toLowerCase();
            const isAuthorized = authorizedAuthors.includes(prAuthor);
            
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_author', pr.user.login);
            core.setOutput('is_authorized', isAuthorized.toString());
            core.setOutput('should_merge', isAuthorized.toString());
            
            console.log(`PR #${pr.number} by ${pr.user.login}`);
            console.log(`Authorized: ${isAuthorized}`);

      - name: Verify PR is Mergeable
        if: steps.pr-info.outputs.should_merge == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ steps.pr-info.outputs.pr_number }};
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Wait a bit for GitHub to update mergeable status
            if (pr.mergeable === null) {
              console.log('Waiting for GitHub to compute mergeable status...');
              await new Promise(r => setTimeout(r, 3000));
              
              const { data: updatedPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              if (!updatedPr.mergeable) {
                core.setFailed('PR has conflicts and cannot be merged');
                return;
              }
            } else if (!pr.mergeable) {
              core.setFailed('PR has conflicts and cannot be merged');
              return;
            }
            
            console.log('✅ PR is mergeable!');

      - name: Update Branch (Rebase)
        if: steps.pr-info.outputs.should_merge == 'true'
        id: update-branch
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ steps.pr-info.outputs.pr_number }};
            
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              // Check if branch is behind
              if (pr.mergeable_state === 'behind') {
                console.log('⚠️  Branch is behind base, but CI already passed');
                console.log('Skipping update to avoid re-running CI');
                console.log('Will attempt direct merge with rebase method');
                core.setOutput('branch_updated', 'false');
              } else {
                console.log('✅ Branch is up-to-date');
                core.setOutput('branch_updated', 'false');
              }
            } catch (error) {
              console.log(`⚠️ Error checking branch status: ${error.message}`);
              core.setOutput('branch_updated', 'false');
            }

      - name: Rebase and Merge
        if: steps.pr-info.outputs.should_merge == 'true'
        id: merge
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ steps.pr-info.outputs.pr_number }};
            
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'rebase'
              });
              
              console.log(`✅ PR #${prNumber} merged successfully!`);
              
              // Store branch name for deletion
              core.setOutput('branch_name', pr.head.ref);
              core.setOutput('merge_success', 'true');
            } catch (error) {
              core.setOutput('merge_success', 'false');
              if (error.status === 405) {
                console.log('PR cannot be merged yet (checks pending or conflicts)');
              } else {
                core.setFailed(`Failed to merge: ${error.message}`);
              }
            }

      - name: Delete merged branch
        if: steps.pr-info.outputs.should_merge == 'true' && steps.merge.outputs.merge_success == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const branchName = '${{ steps.merge.outputs.branch_name }}';
            
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              
              console.log(`🗑️ Branch '${branchName}' deleted successfully!`);
            } catch (error) {
              console.log(`⚠️ Could not delete branch '${branchName}': ${error.message}`);
              // Don't fail the workflow if branch deletion fails
            }

      - name: Skip - Not Authorized
        if: steps.pr-info.outputs.should_merge == 'false' && steps.pr-info.outputs.pr_author != ''
        run: |
          echo "⏭️ Skipping auto-merge for PR by ${{ steps.pr-info.outputs.pr_author }}"
          echo "Only authorized authors can auto-merge: ${{ env.AUTHORIZED_AUTHORS }}"
