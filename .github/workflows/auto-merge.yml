name: Auto Merge PRs

# This workflow enables GitHub's native auto-merge feature for PRs from authorized authors.
# It runs when a PR is opened/reopened/synchronized and enables auto-merge if:
# 1. Author is in AUTHORIZED_AUTHORS list
# 2. PR is not a draft
# 
# GitHub will automatically merge the PR once all required status checks pass.
# This avoids the circular dependency issue where a workflow waits for itself to complete.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

env:
  # Lista de usuarios autorizados para auto-merge (separados por coma)
  AUTHORIZED_AUTHORS: "cryptoganster"

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check Authorization
        id: check-auth
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Skip if PR is draft
            if (pr.draft) {
              console.log('⏭️ PR is draft, skipping auto-merge');
              core.setOutput('should_enable', 'false');
              return;
            }
            
            const authorizedAuthors = process.env.AUTHORIZED_AUTHORS.split(',').map(a => a.trim().toLowerCase());
            const prAuthor = pr.user.login.toLowerCase();
            const isAuthorized = authorizedAuthors.includes(prAuthor);
            
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_author', pr.user.login);
            core.setOutput('is_authorized', isAuthorized.toString());
            core.setOutput('should_enable', isAuthorized.toString());
            
            console.log(`PR #${pr.number} by ${pr.user.login}`);
            console.log(`Authorized: ${isAuthorized}`);

      - name: Enable Auto-Merge
        if: steps.check-auth.outputs.should_enable == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ steps.check-auth.outputs.pr_number }};
            
            try {
              // Get PR node ID for GraphQL
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              // Enable auto-merge using GraphQL API
              const mutation = `
                mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: $mergeMethod
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                        enabledBy {
                          login
                        }
                      }
                    }
                  }
                }
              `;
              
              const result = await github.graphql(mutation, {
                pullRequestId: pr.node_id,
                mergeMethod: 'REBASE'
              });
              
              console.log(`✅ Auto-merge enabled for PR #${prNumber}`);
              console.log('GitHub will automatically merge once all required checks pass');
              console.log(`Enabled at: ${result.enablePullRequestAutoMerge.pullRequest.autoMergeRequest.enabledAt}`);
            } catch (error) {
              // If auto-merge fails, it might be because checks haven't passed yet
              // or there are conflicts - this is expected
              console.log(`ℹ️ Could not enable auto-merge: ${error.message}`);
              console.log('This is normal if checks are still running or there are conflicts');
            }

      - name: Skip - Not Authorized
        if: steps.check-auth.outputs.should_enable == 'false' && steps.check-auth.outputs.pr_author != ''
        run: |
          echo "⏭️ Skipping auto-merge for PR by ${{ steps.check-auth.outputs.pr_author }}"
          echo "Only authorized authors can auto-merge: ${{ env.AUTHORIZED_AUTHORS }}"
